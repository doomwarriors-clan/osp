# Builds qagame, cgame and ui with the xq3osp-build Docker image, prints the size and
# SHA-256 of every QVM (make info), and uploads the QVMs as a workflow artifact. On a tag
# push the same files are attached to a GitHub release named after the tag.
# The sources carry changes on top of OSP 1.03a (security fixes), so the QVMs no longer
# match the release hashes. The byte-identical check (make verify) only runs when the
# workflow is started by hand with "verify" set, e.g. on the original 1.03a sources.
name: build

on:
  push:
    branches: [main, security-patches]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: Compare every QVM with the OSP 1.03a release hash (make verify)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qvm:
    name: build QVMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -f docker/Dockerfile -t xq3osp-build .

      - name: Build modules
        run: |
          for m in qagame cgame ui; do
            docker run --rm -v "$PWD:/work" -w /work xq3osp-build \
              make -C build MODULE="$m" info
          done

      - name: Verify against the OSP 1.03a release
        if: inputs.verify
        run: |
          for m in qagame cgame ui; do
            docker run --rm -v "$PWD:/work" -w /work xq3osp-build \
              make -C build MODULE="$m" verify
          done

      - name: Package
        run: |
          ver="${GITHUB_REF_TYPE}" ; [ "$ver" = tag ] && ver="${GITHUB_REF_NAME}" || ver="${GITHUB_SHA::7}"
          mkdir -p dist/vm
          cp build/vm/*.qvm dist/vm/
          (cd dist && sha256sum vm/*.qvm > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp build/vm/*.map dist/
          (cd dist && zip -r "xq3osp-${ver}-qvm.zip" vm SHA256SUMS.txt)
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Package pk3s
        run: |
          # The pk3s attached to the release: same names and entry layout
          # (vm/ + docs/) as JKornev/xq3osp's 1.03a-secured release, so
          # doomwarriors-clan/q3-servers' install script can swap the source.
          python3 - <<'PYEOF'
          import os, zipfile
          pk3s = (
              ("zz-osp-server4.pk3", ("vm/qagame.qvm",)),
              ("zz-osp-pak5.pk3", ("vm/cgame.qvm", "vm/ui.qvm")),
          )
          for name, qvms in pk3s:
              with zipfile.ZipFile(os.path.join("dist", name), "w", zipfile.ZIP_DEFLATED) as z:
                  z.writestr(zipfile.ZipInfo("vm/"), b"")
                  for q in qvms:
                      z.write(os.path.join("build", q), q)
                  z.writestr(zipfile.ZipInfo("docs/"), b"")
                  z.write("docs/xq3osp.txt", "docs/xq3osp.txt")
              print("built dist/" + name)
          PYEOF
          (cd dist && sha256sum zz-osp-*.pk3 >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: xq3osp-${{ env.ver }}-qvm
          path: dist
          if-no-files-found: error

  release:
    name: attach to release
    needs: qvm
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xq3osp-*-qvm
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: OSP Tourney ${{ github.ref_name }}
          body: |
            OSP Tourney QVMs (`qagame`, `cgame`, `ui`) and pk3s built from the
            clan sources at ${{ github.ref_name }} (JKornev/xq3osp with security
            fixes; the `qagame` additionally carries the DoomWarriors bot
            learning extension "botmem"). The files are not byte-identical to
            the original 1.03a release; `SHA256SUMS.txt` lists the hashes of
            this build.

            Servers: drop `zz-osp-server4.pk3` (qagame) into the `osp` mod
            directory, next to the original OSP pk3s. Clients get
            `zz-osp-pak5.pk3` (cgame, ui). Or use the attached zip / loose QVMs
            as is.
          files: |
            dist/xq3osp-*-qvm.zip
            dist/zz-osp-server4.pk3
            dist/zz-osp-pak5.pk3
            dist/vm/*.qvm
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
