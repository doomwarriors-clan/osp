# Builds qagame, cgame and ui with the xq3osp-build Docker image, prints the size and
# SHA-256 of every QVM (make info), and uploads the QVMs as a workflow artifact. On a tag
# push the same files are attached to a GitHub release named after the tag.
# The sources carry changes on top of OSP 1.03a (security fixes), so the QVMs no longer
# match the release hashes. The byte-identical check (make verify) only runs when the
# workflow is started by hand with "verify" set, e.g. on the original 1.03a sources.
name: build

on:
  push:
    branches: [main, security-patches]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify:
        description: Compare every QVM with the OSP 1.03a release hash (make verify)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qvm:
    name: build QVMs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build -f docker/Dockerfile -t xq3osp-build .

      - name: Build modules
        run: |
          for m in qagame cgame ui; do
            docker run --rm -v "$PWD:/work" -w /work xq3osp-build \
              make -C build MODULE="$m" info
          done

      - name: Verify against the OSP 1.03a release
        if: inputs.verify
        run: |
          for m in qagame cgame ui; do
            docker run --rm -v "$PWD:/work" -w /work xq3osp-build \
              make -C build MODULE="$m" verify
          done

      - name: Package
        run: |
          ver="${GITHUB_REF_TYPE}" ; [ "$ver" = tag ] && ver="${GITHUB_REF_NAME}" || ver="${GITHUB_SHA::7}"
          mkdir -p dist/vm
          cp build/vm/*.qvm dist/vm/
          (cd dist && sha256sum vm/*.qvm > SHA256SUMS.txt && cat SHA256SUMS.txt)
          cp build/vm/*.map dist/
          (cd dist && zip -r "xq3osp-${ver}-qvm.zip" vm SHA256SUMS.txt)
          echo "ver=$ver" >> "$GITHUB_ENV"

      - name: Check that the client QVMs are JKornev's 1.03a-secured
        run: |
          # Only qagame carries DoomWarriors changes. cgame and ui must stay
          # byte-identical to JKornev/xq3osp 1.03a-secured, so clients keep
          # using its zz-osp-pak5.pk3 and no second client pk3 with other
          # content is needed. Changing client code is a deliberate decision
          # (own client pk3 with its own name); then update this check.
          cat > secured.sha256 <<'EOF'
          fa3cbd913fbd5261bf463dd207ea2ef7be2d9ab7b723aff717b0ce6da02099b1  build/vm/cgame.qvm
          118d98fab3623398a89178ae8e6d072967166206b15b238c95d95555fd326d64  build/vm/ui.qvm
          EOF
          sha256sum -c secured.sha256

      - name: Package server pk3
        run: |
          # Our qagame in a pk3 of its own name, sorted after zz-osp-* so it
          # overrides zz-osp-server4.pk3 of 1.03a-secured. Never reuse an
          # OSP or xq3osp file name: clients that have a pk3 of the same name
          # with other content fail the pure check.
          # Tag 1.03a-dwc.N -> zzz-osp-dwcN.pk3, other builds -> zzz-osp-dwc-<sha>.pk3
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" =~ ^1\.03a-dwc\.([0-9]+)$ ]]; then
            pk3="zzz-osp-dwc${BASH_REMATCH[1]}.pk3"
          else
            pk3="zzz-osp-dwc-${GITHUB_SHA::7}.pk3"
          fi
          rm -rf stage && mkdir -p stage/vm stage/docs
          cp build/vm/qagame.qvm stage/vm/
          cp docs/xq3osp.txt stage/docs/
          (cd stage && zip -X -r "../dist/${pk3}" vm docs)
          (cd dist && sha256sum "${pk3}" >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: xq3osp-${{ env.ver }}-qvm
          path: dist
          if-no-files-found: error

  release:
    name: attach to release
    needs: qvm
    if: github.ref_type == 'tag' && startsWith(github.ref_name, '1.03a-dwc.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xq3osp-*-qvm
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: OSP Tourney ${{ github.ref_name }}
          body: |
            OSP Tourney ${{ github.ref_name }}: the server module (`qagame`)
            built from JKornev/xq3osp `security-patches` plus the DoomWarriors
            bot learning extension "botmem". `cgame` and `ui` are unchanged and
            byte-identical to
            [1.03a-secured](https://github.com/JKornev/xq3osp/releases/tag/1.03a-secured)
            (checked in the build). `SHA256SUMS.txt` lists the hashes.

            Servers: put the `zzz-osp-dwc*.pk3` (qagame) into the `osp` mod
            directory, next to the original OSP pk3s and the two pk3s of
            1.03a-secured (`zz-osp-server4.pk3`, `zz-osp-pak5.pk3`). Clients
            need nothing beyond 1.03a-secured's `zz-osp-pak5.pk3`.
          files: |
            dist/xq3osp-*-qvm.zip
            dist/zzz-osp-dwc*.pk3
            dist/vm/*.qvm
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
